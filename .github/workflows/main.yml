name: Build PiPTranslator IPA

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle ID（自己取一個不會跟別人重複的）"
        required: false
        default: "tw.personal.pipxlate"
  push:

jobs:
  build:
    runs-on: macos-15
    env:
      BUNDLE_ID: ${{ github.event.inputs.bundle_id || 'tw.personal.pipxlate' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show Xcode
        run: xcodebuild -version

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project PiPTranslator.xcodeproj \
            -scheme PiPTranslator \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            BASE_BUNDLE_ID="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*deprecated|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/PiPTranslator.app

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/PiPTranslator.app
          ls "$APP/PlugIns"
          plutil -p "$APP/PlugIns/BroadcastExtension.appex/Info.plist" | grep -A4 NSExtension
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry PiPTranslator.ipa Payload
          echo "== IPA check =="
          ls -la PiPTranslator.ipa
          unzip -tq PiPTranslator.ipa
          unzip -l PiPTranslator.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PiPTranslator-ipa
          path: PiPTranslator.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
